<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>𝐏𝐮𝐭𝐫𝐚 𝐛𝐚𝐫𝐨𝐤𝐚𝐡 𓃵</title>
<!-- PENAMBAHAN LOGO PADA TAB (FAVICON) -->
<link rel="icon" type="image/png" href="https://files.catbox.moe/3w0di0.png">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Syncopate:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-auth-compat.min.js"></script>

<style>
:root {
--gold: #ffcc00;
--gold-bright: #fffb00;
--gold-glow: rgba(255, 204, 0, 0.8);
}

body {
font-family: 'Rajdhani', sans-serif;
background-color: #f8fafc;
color: #0f172a;
overflow-x: hidden;
}

/* BACKGROUND HD TERANG */
#video-bg {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
object-fit: cover; z-index: -2;
filter: brightness(0.95) contrast(1.05);
}
.vignette {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
background: radial-gradient(circle, transparent 60%, rgba(255, 255, 255, 0.3) 100%);
z-index: -1;
}

/* JUDUL ATAS */
.title-main {
background: linear-gradient(90deg, #0f172a, var(--gold), #0f172a);
background-size: 200% auto;
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
animation: flowHD 4s linear infinite;
font-weight: 900; font-style: italic;
}
@keyframes flowHD { to { background-position: 200% center; } }

/* ANIMASI GRADIENT BERGERAK */
@keyframes moveGradient {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}

/* GAYA TOMBOL 3D (DASHBOARD & BARU) */
.tech-card, #btnSimpan, .tech-card-item, .fab-gold {
position: relative;
background: linear-gradient(270deg, #000000, #b89f1a, #2d3a08, #000000);
background-size: 400% 400%;
transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
cursor: pointer;
border: 1px solid rgba(255,255,255,0.1);
color: white;
text-transform: uppercase;
font-weight: 900;
}

.tech-card {
height: 80px; padding: 0 1.5rem !important; margin-bottom: 1.2rem;
display: flex; align-items: center; justify-content: space-between;
border-radius: 15px;
box-shadow: 0 8px 0 #1a1d04, 0 15px 20px rgba(0,0,0,0.3);
}

/* KARTU ITEM LIST (TEMA EMAS KEHIJAUAN HITAM) */
.tech-card-item {
border-radius: 18px;
overflow: hidden;
box-shadow: 0 10px 20px rgba(0,0,0,0.4);
border: 1px solid #b89f1a;
}

/* TOMBOL TAMBAH (+) BERGERAK */
.fab-gold {
width: 55px; height: 55px;
border-radius: 50%;
font-size: 28px;
display: flex; align-items: center; justify-content: center;
box-shadow: 0 10px 20px rgba(0,0,0,0.5);
animation: moveGradient 3s ease infinite;
border: 2px solid var(--gold);
}

#btnSimpan { width: 100%; padding: 1rem; margin-top: 1rem; border-radius: 15px; box-shadow: 0 6px 0 #1a1d04; }

/* HOVER & ACTIVE */
.tech-card:hover, #btnSimpan:hover, .tech-card-item:hover, .fab-gold:hover {
animation: moveGradient 3s ease infinite;
transform: translateY(2px);
}

.tech-card:active, #btnSimpan:active, .fab-gold:active {
transform: translateY(8px);
box-shadow: 0 0px 0 #1a1d04;
}

.tech-card h3 { font-size: 1rem; letter-spacing: 3px; z-index: 5; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
.tech-card .count { font-size: 2.8rem; z-index: 5; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }

/* NAV BAR */
.top-status-bar {
background: rgba(255, 255, 255, 0.4);
backdrop-filter: blur(10px);
border-bottom: 1.5px solid var(--gold);
height: 70px;
}
#liveClock { font-family: 'Orbitron', sans-serif; color: #0f172a; font-weight: 900; font-size: 1.4rem; }

/* MODAL TEMA GELAP EMAS */
.modal-content {
background: linear-gradient(135deg, #0a0f02 0%, #1a1d04 100%);
border: 2px solid #b89f1a;
border-radius: 24px;
overflow: hidden;
width: 100%;
max-width: 500px;
box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
color: white;
}
.detail-media-box {
width: 100%;
height: 350px;
background: #000;
position: relative;
overflow: hidden;
cursor: zoom-in;
}
.detail-media-box img, .detail-media-box video {
width: 100%;
height: 100%;
object-fit: cover;
}
.parent-img-box {
width: 100%;
height: 100px;
border-radius: 12px;
overflow: hidden;
cursor: zoom-in;
background: #000;
margin-bottom: 4px;
border: 1px solid #b89f1a;
}
.parent-img-box img {
width: 100%;
height: 100%;
object-fit: cover;
}

input, select {
background: rgba(0,0,0,0.5) !important;
border: 1px solid #b89f1a !important;
color: white !important;
padding: 10px;
border-radius: 8px;
}
label { color: var(--gold); font-size: 9px; font-weight: bold; }
</style>
</head>
<body>

<video autoplay muted loop playsinline id="video-bg">
<source src="https://files.catbox.moe/i8p8ug.mp4" type="video/mp4">
</video>
<div class="vignette"></div>

<!-- NAV BAR -->
<nav class="fixed top-0 left-0 w-full z-[200] top-status-bar px-4 flex justify-between items-center">
<img src="https://files.catbox.moe/3w0di0.png" alt="Logo" class="h-16 w-auto">
<div class="absolute left-1/2 -translate-x-1/2 text-center">
<p id="liveClock">00.00.00</p>
<p id="liveDate" class="text-[8px] text-slate-500 tracking-[4px] uppercase font-bold"></p>
</div>
<div>
<button id="btnLogin" class="border border-slate-900 text-slate-900 px-3 py-1 text-[9px] font-black rounded uppercase">Login</button>
<button id="btnLogout" onclick="auth.signOut()" class="hidden text-red-600 text-[9px] font-black border border-red-600 px-3 py-1 rounded">Logout</button>
</div>
</nav>

<main class="relative pt-28 pb-20 px-6 max-w-4xl mx-auto">
<header class="mb-10 text-center">
<h1 class="title-main text-5xl md:text-7xl italic uppercase leading-tight">PUTRA BAROKAH<br><span class="text-slate-800">FARM</span></h1>
<p class="text-[10px] font-['Orbitron'] tracking-[8px] text-slate-1000 mt-2 uppercase font-bold">GENERASI PETERNAK MODERN</p>
</header>

<section class="grid grid-cols-1 gap-2 mb-8">
<div onclick="filterCategory('Indukan')" class="tech-card"><h3>Indukan</h3><div class="count" id="totalIndukan">0</div></div>
<div onclick="filterCategory('Pejantan')" class="tech-card"><h3>Pejantan</h3><div class="count" id="totalPejantan">0</div></div>
<div onclick="filterCategory('Cempe')" class="tech-card"><h3>Cempe</h3><div class="count" id="totalCempe">0</div></div>
</section>

<div id="containerList" class="hidden">
<div class="flex justify-between items-center mb-4 border-b border-slate-900 pb-1">
<h2 id="categoryTitle" class="text-xl font-black text-slate-900 italic uppercase">Archive</h2>
<button onclick="hideList()" class="text-[9px] font-bold bg-slate-900 text-white px-2 py-1 rounded tracking-widest">CLOSE X</button>
</div>
<div id="listDomba" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
</div>
</main>

<!-- TOMBOL TAMBAH DATA (ANIMASI BERGERAK) -->
<div id="adminMenu" class="fixed bottom-8 right-8 z-[300] hidden">
<button onclick="toggleForm()" class="fab-gold">+</button>
</div>

<!-- FORM TAMBAH DATA -->
<div id="formModal" class="fixed inset-0 z-[400] bg-black/70 flex items-center justify-center hidden p-4 backdrop-blur-md">
<div class="modal-content p-6">
<h2 class="text-lg font-black text-gold mb-4 uppercase border-b border-gold pb-1">Input Ternak Baru</h2>
<div class="space-y-3">
<input type="text" id="nama" placeholder="NAMA TERNAK" class="w-full">
<div class="grid grid-cols-2 gap-2">
<select id="kategori" onchange="handleCategoryChange()" class="w-full">
<option value="Indukan">Indukan</option>
<option value="Pejantan">Pejantan</option>
<option value="Cempe">Cempe</option>
</select>
<input type="number" id="berat" placeholder="KG" class="w-full">
</div>
<input type="date" id="tglLahir" class="w-full">
<div id="silsilahBox" class="hidden space-y-2 bg-black/40 p-3 rounded-lg border border-gold/30">
<div class="grid grid-cols-2 gap-2">
<div><label class="uppercase block mb-1">Ibu (Dam)</label><select id="selectMamak" class="w-full"></select></div>
<div><label class="uppercase block mb-1">Ayah (Sire)</label><select id="selectBapak" class="w-full"></select></div>
</div>
</div>
<input type="file" id="fileUtama" class="text-[10px] w-full">
<button onclick="simpanData()" id="btnSimpan">UPLOAD DATA</button>
<button onclick="toggleForm()" class="w-full text-slate-400 text-[9px] font-bold uppercase mt-2">Batal</button>
</div>
</div>
</div>

<!-- DETAIL MODAL -->
<div id="detailModal" class="fixed inset-0 z-[500] bg-black/90 flex items-center justify-center hidden p-4">
<div class="modal-content">
<div id="detMediaUtama" class="detail-media-box"></div>
<div class="p-5">
<div class="flex justify-between items-start mb-5">
<div>
<h2 id="detNama" class="text-3xl font-black text-white uppercase italic leading-none"></h2>
<p id="detUmur" class="text-gold font-bold text-[11px] mt-1 tracking-widest"></p>
</div>
<p id="detBerat" class="text-2xl font-black text-gold"></p>
</div>
<div id="detSilsilahBox" class="hidden grid grid-cols-2 gap-3 mb-6">
<div class="text-center">
<p class="text-[8px] text-blue-400 font-black uppercase mb-1 tracking-widest">Sire (Ayah)</p>
<div id="detMediaBapak" class="parent-img-box"></div>
<p id="detNamaBapak" class="font-bold text-[10px] uppercase truncate text-slate-200"></p>
</div>
<div class="text-center">
<p class="text-[8px] text-pink-400 font-black uppercase mb-1 tracking-widest">Dam (Ibu)</p>
<div id="detMediaMamak" class="parent-img-box"></div>
<p id="detNamaMamak" class="font-bold text-[10px] uppercase truncate text-slate-200"></p>
</div>
</div>
<button onclick="document.getElementById('detailModal').classList.add('hidden')" class="w-full bg-gold text-white py-3 font-black text-[10px] uppercase tracking-[10px] rounded-xl shadow-lg">KEMBALI</button>
</div>
</div>
</div>

<script>
const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/dlfjqxzoi/auto/upload";
const CLOUDINARY_PRESET = "barokah_preset";
const firebaseConfig = {
apiKey: "AIzaSyC5iURiLrXJ-6AjgKfBlOW71Oo719AVNx4",
authDomain: "putra-barokah-farm.firebaseapp.com",
projectId: "putra-barokah-farm",
storageBucket: "putra-barokah-farm.appspot.com",
messagingSenderId: "877461927373",
appId: "1:877461927373:web:5e9fbcb1b892d7cd6e8084"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore(), auth = firebase.auth();
let allData = [];
let isAdmin = false;

function hitungUmur(tglLahir) {
if (!tglLahir) return "";
const birth = new Date(tglLahir);
const now = new Date();
const diffTime = Math.abs(now - birth);
const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
if (diffDays < 30) return diffDays + " HARI";
const months = Math.floor(diffDays / 30);
const days = diffDays % 30;
return months + " BULAN " + (days > 0 ? days + " HARI" : "");
}

function updateClock() {
const now = new Date();
document.getElementById('liveClock').innerText = now.toLocaleTimeString('id-ID', { hour12: false });
document.getElementById('liveDate').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
}
setInterval(updateClock, 1000); updateClock();

auth.onAuthStateChanged(user => {
isAdmin = user && ["uvKshTqDchhJFNDkzGEC2MMgI003", "lfghFBI24GVP0AqyfGHNCh5E4EL2"].includes(user.uid);
document.getElementById('adminMenu').classList.toggle('hidden', !isAdmin);
document.getElementById('btnLogout').classList.toggle('hidden', !user);
document.getElementById('btnLogin').classList.toggle('hidden', user);
});

document.getElementById('btnLogin').onclick = () => {
const e = prompt("ID:"), p = prompt("KEY:");
if(e && p) auth.signInWithEmailAndPassword(e, p).catch(() => alert("Denied"));
};

db.collection("ternak_barokah").orderBy("createdAt", "desc").onSnapshot(snapshot => {
allData = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
document.getElementById('totalIndukan').innerText = allData.filter(d => d.kategori === 'Indukan').length;
document.getElementById('totalPejantan').innerText = allData.filter(d => d.kategori === 'Pejantan').length;
document.getElementById('totalCempe').innerText = allData.filter(d => d.kategori === 'Cempe').length;

const sB = document.getElementById('selectBapak'), sM = document.getElementById('selectMamak');
sB.innerHTML = '<option value="">- AYAH -</option>';
allData.filter(d => d.kategori === 'Pejantan').forEach(p => sB.innerHTML += `<option value="${p.nama}" data-img="${p.media}">${p.nama.toUpperCase()}</option>`);
sM.innerHTML = '<option value="">- IBU -</option>';
allData.filter(d => d.kategori === 'Indukan').forEach(i => sM.innerHTML += `<option value="${i.nama}" data-img="${i.media}">${i.nama.toUpperCase()}</option>`);
});

function handleCategoryChange() {
const kat = document.getElementById('kategori').value;
document.getElementById('silsilahBox').classList.toggle('hidden', kat !== 'Cempe');
}

function toggleForm() { document.getElementById('formModal').classList.toggle('hidden'); }
function hideList() { document.getElementById('containerList').classList.add('hidden'); }

function renderMedia(url, css) {
if(!url) return `<div class="bg-slate-900 w-full h-full flex items-center justify-center text-[8px] text-slate-400 italic">No Media</div>`;
return url.includes(".mp4") ? `<video src="${url}" class="${css}" autoplay loop muted playsinline></video>` : `<img src="${url}" class="${css}" loading="lazy">`;
}

async function simpanData() {
const btn = document.getElementById('btnSimpan');
const file = document.getElementById('fileUtama').files[0];
const nama = document.getElementById('nama').value;
const kategori = document.getElementById('kategori').value;
if(!nama || !file) return alert("Data Belum Lengkap!");
btn.disabled = true; btn.innerText = "Processing...";
try {
const formData = new FormData();
formData.append("file", file);
formData.append("upload_preset", CLOUDINARY_PRESET);
const res = await fetch(CLOUDINARY_URL, { method: "POST", body: formData });
const dC = await res.json();
const sB = document.getElementById('selectBapak'), sM = document.getElementById('selectMamak');

await db.collection("ternak_barokah").add({
nama: nama.toUpperCase(),
kategori: kategori,
berat: document.getElementById('berat').value || 0,
tglLahir: document.getElementById('tglLahir').value,
bapak: kategori === 'Cempe' ? sB.value : "",
fotoBapak: kategori === 'Cempe' ? sB.options[sB.selectedIndex].getAttribute('data-img') || "" : "",
mamak: kategori === 'Cempe' ? sM.value : "",
fotoMamak: kategori === 'Cempe' ? sM.options[sM.selectedIndex].getAttribute('data-img') || "" : "",
media: dC.secure_url,
createdAt: firebase.firestore.FieldValue.serverTimestamp()
});
alert("Berhasil!"); location.reload();
} catch (e) { alert("Error!"); btn.disabled = false; btn.innerText = "UPLOAD DATA"; }
}

function filterCategory(cat) {
document.getElementById('categoryTitle').innerText = cat;
const container = document.getElementById('listDomba'); container.innerHTML = '';
allData.filter(d => d.kategori === cat).forEach(item => {
const card = document.createElement('div');
card.className = "tech-card-item cursor-pointer";
card.onclick = () => showDetail(item);
const infoUmur = item.kategori === 'Cempe' ? `<p class="text-[7px] text-white/60 uppercase">UMUR: ${hitungUmur(item.tglLahir)}</p>` : '';
card.innerHTML = `<div class="h-28 w-full border-b border-gold/20">${renderMedia(item.media, 'w-full h-full object-cover')}</div>
<div class="p-3">
<h4 class="text-[10px] font-black uppercase text-white truncate tracking-wider">${item.nama}</h4>
<div class="flex justify-between items-center mt-1">
<p class="text-[9px] text-gold font-bold">${item.berat} KG</p>
${infoUmur}
</div>
${isAdmin ? `<button onclick="event.stopPropagation(); hapus('${item.id}')" class="mt-2 text-red-500 text-[8px] font-black uppercase">Delete</button>` : ''}
</div>`;
container.appendChild(card);
});
document.getElementById('containerList').classList.remove('hidden');
window.scrollTo({ top: document.getElementById('containerList').offsetTop - 100, behavior: 'smooth' });
}

function showDetail(item) {
document.getElementById('detNama').innerText = item.nama;
document.getElementById('detBerat').innerText = item.berat + " KG";
const detUmur = document.getElementById('detUmur');
if(item.kategori === 'Cempe' && item.tglLahir) {
detUmur.innerText = "UMUR: " + hitungUmur(item.tglLahir);
detUmur.classList.remove('hidden');
} else {
detUmur.classList.add('hidden');
}
const mediaBox = document.getElementById('detMediaUtama');
mediaBox.innerHTML = renderMedia(item.media, 'w-full h-full object-cover');
mediaBox.onclick = () => window.open(item.media, '_blank');
const isCempe = item.kategori === 'Cempe';
const detSilsilahBox = document.getElementById('detSilsilahBox');
detSilsilahBox.classList.toggle('hidden', !isCempe);
if(isCempe) {
const bapakBox = document.getElementById('detMediaBapak');
bapakBox.innerHTML = renderMedia(item.fotoBapak, 'w-full h-full object-cover');
bapakBox.onclick = () => item.fotoBapak ? window.open(item.fotoBapak, '_blank') : null;
document.getElementById('detNamaBapak').innerText = item.bapak || "-";
const mamakBox = document.getElementById('detMediaMamak');
mamakBox.innerHTML = renderMedia(item.fotoMamak, 'w-full h-full object-cover');
mamakBox.onclick = () => item.fotoMamak ? window.open(item.fotoMamak, '_blank') : null;
document.getElementById('detNamaMamak').innerText = item.mamak || "-";
}
document.getElementById('detailModal').classList.remove('hidden');
}

async function hapus(id) { if(confirm("Hapus?")) await db.collection("ternak_barokah").doc(id).delete(); }
</script>
</body>
</html>
