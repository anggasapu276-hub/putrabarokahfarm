<script type="module">
    // Import library Firebase (Wajib untuk sinkronisasi)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // --- BAGIAN INI HARUS DIGANTI DENGAN PUNYA ANDA DARI FIREBASE ---
    const firebaseConfig = {
        apiKey: "AIzaSy...",
        authDomain: "farmbarokah.firebaseapp.com",
        databaseURL: "https://farmbarokah-default-rtdb.firebaseio.com",
        projectId: "farmbarokah",
        storageBucket: "farmbarokah.appspot.com",
        messagingSenderId: "...",
        appId: "..."
    };

    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const ternakRef = ref(db, 'data_ternak');

    let dataTernak = [];
    let currentFilter = '';

    // --- 1. SINKRONISASI OTOMATIS (Mendengarkan perubahan di Cloud) ---
    onValue(ternakRef, (snapshot) => {
        const data = snapshot.val();
        dataTernak = [];
        if (data) {
            // Ubah format objek Firebase menjadi Array agar tabel jalan
            Object.keys(data).forEach(key => {
                dataTernak.push({ key: key, ...data[key] });
            });
        }
        updateStats(); // Update angka di dashboard secara otomatis
        if (currentFilter) showData(currentFilter); // Update tabel jika sedang terbuka
    });

    // --- 2. LOGIKA UPDATE DASHBOARD ---
    function updateStats() {
        document.getElementById('count-indukan').innerText = dataTernak.filter(d => d.kategori === 'Indukan').length;
        document.getElementById('count-pejantan').innerText = dataTernak.filter(d => d.kategori === 'Pejantan').length;
        document.getElementById('count-anakan').innerText = dataTernak.filter(d => d.kategori === 'Anakan').length;
    }

    // Fungsi global agar tombol HTML bisa memanggil fungsi di dalam type="module"
    window.showData = function(category) {
        currentFilter = category;
        const section = document.getElementById('data-section');
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';
        
        const filtered = dataTernak.filter(d => d.kategori === category);
        document.getElementById('table-title').innerText = `Kelompok: ${category}`;

        if(filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-gray-400 font-black uppercase tracking-widest">Belum ada data</td></tr>`;
        } else {
            filtered.forEach(item => {
                tbody.innerHTML += `
                    <tr class="hover:bg-white/50 transition animate-fade">
                        <td class="px-8 py-4 text-center"><img src="${item.foto}" class="img-table mx-auto shadow-md cursor-pointer hover:scale-105 transition" onclick="viewDetail('${item.key}')"></td>
                        <td class="px-8 py-4 cursor-pointer" onclick="viewDetail('${item.key}')"><div class="font-black uppercase tracking-tighter">${item.nama}</div><div class="text-[9px] text-green-600 font-bold">${item.id}</div></td>
                        <td class="px-8 py-4 text-center font-black ${item.jk === 'Jantan' ? 'text-blue-500' : 'text-pink-500'} text-xs">${item.jk === 'Jantan' ? '♂ JANTAN' : '♀ BETINA'}</td>
                        <td class="px-8 py-4 text-center"><button onclick="deleteData('${item.key}')" class="text-red-300 hover:text-red-600 transition p-2"><i class="fas fa-trash-alt"></i></button></td>
                    </tr>`;
            });
        }
        section.style.display = 'block';
        setTimeout(() => section.style.opacity = '1', 10);
        document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active-card-indukan', 'active-card-pejantan', 'active-card-anakan'));
        document.getElementById(`card-${category}`).classList.add(`active-card-${category.toLowerCase()}`);
    };

    window.hideData = function() { 
        const s = document.getElementById('data-section');
        s.style.opacity = '0';
        setTimeout(() => s.style.display = 'none', 300);
    };

    // --- 3. LOGIKA TAMBAH DATA (SIMPAN KE CLOUD) ---
    window.openAddModal = function() {
        const iSel = document.getElementById('selectInduk');
        const pSel = document.getElementById('selectPejantan');
        iSel.innerHTML = '<option value="">Pilih Induk...</option>';
        pSel.innerHTML = '<option value="">Pilih Pejantan...</option>';
        dataTernak.filter(d => d.kategori === 'Indukan').forEach(d => iSel.innerHTML += `<option value="${d.nama}">${d.nama}</option>`);
        dataTernak.filter(d => d.kategori === 'Pejantan').forEach(d => pSel.innerHTML += `<option value="${d.nama}">${d.nama}</option>`);
        document.getElementById('modalAdd').classList.remove('hidden');
    };

    window.checkAnakan = function() {
        const kat = document.getElementById('inputKategori').value;
        document.getElementById('formAnakan').classList.toggle('hidden', kat !== 'Anakan');
    }

    document.getElementById('addForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const file = document.getElementById('inputFoto').files[0];
        
        const saveAction = (imgUrl) => {
            const kat = document.getElementById('inputKategori').value;
            const newTernak = {
                id: 'PBF-' + Math.floor(100 + Math.random() * 899),
                foto: imgUrl || 'https://via.placeholder.com/300?text=No+Photo',
                nama: document.getElementById('inputNama').value,
                kategori: kat,
                jk: document.getElementById('inputJK').value,
                mother: kat === 'Anakan' ? document.getElementById('selectInduk').value : null,
                father: kat === 'Anakan' ? document.getElementById('selectPejantan').value : null,
                birth: kat === 'Anakan' ? (document.getElementById('inputTglLahir').value || '-') : '-',
                weight: kat === 'Anakan' ? (document.getElementById('inputBobotLahir').value || '0') : '-'
            };
            
            // Simpan ke Cloud Firebase
            push(ternakRef, newTernak);
            
            document.getElementById('modalAdd').classList.add('hidden');
            this.reset();
            document.getElementById('formAnakan').classList.add('hidden');
        };

        if(file) {
            const reader = new FileReader();
            reader.onloadend = () => saveAction(reader.result);
            reader.readAsDataURL(file);
        } else {
            saveAction();
        }
    });

    window.deleteData = function(key) { 
        if(confirm('Hapus data dari Cloud? Data di semua perangkat akan ikut terhapus.')) { 
            const itemRef = ref(db, `data_ternak/${key}`);
            remove(itemRef);
        } 
    };

    window.viewDetail = function(key) {
        const d = dataTernak.find(item => item.key === key);
        let silsilahHtml = '';
        if(d.kategori === 'Anakan') {
            silsilahHtml = `
            <div class="mt-8 border-t pt-6 grid grid-cols-2 gap-4">
                <div class="bg-pink-50 p-4 rounded-3xl border border-pink-100 text-center">
                    <p class="text-[9px] font-black text-pink-400 uppercase italic">Induk (Ibu)</p>
                    <p class="font-black text-gray-800">${d.mother || '-'}</p>
                </div>
                <div class="bg-blue-50 p-4 rounded-3xl border border-blue-100 text-center">
                    <p class="text-[9px] font-black text-blue-400 uppercase italic">Pejantan (Ayah)</p>
                    <p class="font-black text-gray-800">${d.father || '-'}</p>
                </div>
                <div class="col-span-2 bg-yellow-50 p-4 rounded-3xl border border-yellow-100 flex justify-around text-center">
                    <div><p class="text-[9px] font-black text-yellow-600 uppercase">Tgl Lahir</p><p class="font-black">${d.birth}</p></div>
                    <div><p class="text-[9px] font-black text-yellow-600 uppercase">Bobot Lahir</p><p class="font-black">${d.weight} KG</p></div>
                </div>
            </div>`;
        }
        document.getElementById('detailContent').innerHTML = `
            <img src="${d.foto}" class="w-48 h-48 object-cover rounded-[3rem] shadow-2xl border-4 border-yellow-400 mx-auto mb-6">
            <h4 class="text-4xl font-black text-gray-900 uppercase tracking-tighter">${d.nama}</h4>
            <p class="text-green-700 font-black text-sm tracking-[0.2em] mb-2 uppercase">${d.id} | ${d.kategori}</p>
            ${silsilahHtml}
        `;
        document.getElementById('modalDetail').classList.remove('hidden');
    }

    window.toggleModal = function(id) { document.getElementById(id).classList.toggle('hidden'); }
    window.closeAddModal = function() { document.getElementById('modalAdd').classList.add('hidden'); }
</script>
