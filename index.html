<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUTRA BAROKAH FARM</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-firestore-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-auth-compat.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), url('https://images.unsplash.com/photo-1511117833452-1811aa090c2a?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .font-brand {
            font-family: 'Bebas Neue', cursive;
            letter-spacing: 4px;
            text-shadow: 2px 4px 8px rgba(0,0,0,0.5);
        }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); }
        .card-stat { transition: all 0.3s ease; }
        .card-stat:active { transform: scale(0.95); }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- TOMBOL TAMBAH (HANYA ADMIN) -->
    <div id="adminMenu" class="fixed top-5 right-5 z-50 hidden">
        <button onclick="toggleForm()" class="bg-green-600 hover:bg-green-500 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-3xl font-bold">＋</button>
    </div>

    <div class="max-w-4xl mx-auto p-4">
        <!-- HEADER -->
        <header class="text-center py-12">
            <h1 class="text-6xl md:text-7xl font-brand text-white">PUTRA BAROKAH FARM</h1>
            <p class="text-green-400 font-bold tracking-[0.3em] mt-1 uppercase text-xs">Premium Dorper Breeder & Livestock</p>
            <div id="authStatus" class="mt-6 text-[10px] font-bold text-gray-400 uppercase tracking-widest text-center"></div>
            <div class="flex justify-center gap-3">
                <button id="btnLogin" class="mt-4 bg-white/10 text-white border border-white/20 px-6 py-2 rounded-full text-xs font-bold hidden">LOGIN ADMIN</button>
                <button id="btnLogout" onclick="auth.signOut()" class="mt-4 bg-red-600/80 text-white px-6 py-2 rounded-full text-xs font-bold hidden">KELUAR</button>
            </div>
        </header>

        <!-- MENU NAVIGASI (STAT CARDS) -->
        <div class="grid grid-cols-3 gap-3 mb-10 text-center">
            <div onclick="filterCategory('Indukan')" class="card-stat glass p-4 rounded-[2rem] shadow-2xl border-b-4 border-pink-500 cursor-pointer hover:bg-pink-50">
                <h3 class="text-gray-400 text-[10px] font-black uppercase">Indukan</h3>
                <p id="totalIndukan" class="text-4xl font-black text-pink-600">0</p>
            </div>
            <div onclick="filterCategory('Pejantan')" class="card-stat glass p-4 rounded-[2rem] shadow-2xl border-b-4 border-blue-500 cursor-pointer hover:bg-blue-50">
                <h3 class="text-gray-400 text-[10px] font-black uppercase">Pejantan</h3>
                <p id="totalPejantan" class="text-4xl font-black text-blue-600">0</p>
            </div>
            <div onclick="filterCategory('Cempe')" class="card-stat glass p-4 rounded-[2rem] shadow-2xl border-b-4 border-yellow-500 cursor-pointer hover:bg-yellow-50">
                <h3 class="text-gray-400 text-[10px] font-black uppercase">Cempe</h3>
                <p id="totalCempe" class="text-4xl font-black text-yellow-600">0</p>
            </div>
        </div>

        <!-- TAMPILAN DAFTAR TERNAK -->
        <div id="containerList" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 id="categoryTitle" class="text-2xl font-black text-white uppercase tracking-tighter italic">Daftar Ternak</h2>
                <button onclick="hideList()" class="bg-white/20 text-white px-4 py-1 rounded-full text-xs font-bold border border-white/30 tracking-widest">TUTUP X</button>
            </div>
            <div id="listDomba" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Data muncul di sini -->
            </div>
        </div>
    </div>

    <!-- MODAL FORM TAMBAH -->
    <div id="formModal" class="fixed inset-0 z-[60] hidden items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div class="glass w-full max-w-lg rounded-[2.5rem] p-8 relative shadow-2xl">
            <button onclick="toggleForm()" class="absolute top-6 right-6 text-gray-400 hover:text-red-500 font-bold text-2xl">✕</button>
            <h2 class="text-2xl font-black text-gray-800 mb-6 uppercase tracking-tighter italic">Tambah Ternak Baru</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="col-span-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase">Nama / Tag</label>
                    <input type="text" id="nama" class="w-full border-2 border-gray-100 p-3 rounded-2xl focus:border-green-500 outline-none font-bold">
                </div>
                <div>
                    <label class="text-[10px] font-black text-gray-400 uppercase">Kategori</label>
                    <select id="kategori" onchange="checkCempe()" class="w-full border-2 border-gray-100 p-3 rounded-2xl focus:border-green-500 outline-none font-bold">
                        <option value="Indukan">Indukan</option>
                        <option value="Pejantan">Pejantan</option>
                        <option value="Cempe">Cempe</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-black text-gray-400 uppercase">Berat (kg)</label>
                    <input type="number" id="berat" class="w-full border-2 border-gray-100 p-3 rounded-2xl outline-none font-bold">
                </div>
                <div class="col-span-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase">Tgl Lahir</label>
                    <input type="date" id="tglLahir" class="w-full border-2 border-gray-100 p-3 rounded-2xl outline-none font-bold">
                </div>
                <div id="cempeExtra" class="hidden col-span-2 grid grid-cols-2 gap-3 bg-green-50 p-4 rounded-2xl border-2 border-green-100">
                    <div>
                        <label class="text-[9px] font-black text-green-700 uppercase">Ibu</label>
                        <select id="indukIbu" class="w-full p-2 rounded-xl text-sm"></select>
                    </div>
                    <div>
                        <label class="text-[9px] font-black text-green-700 uppercase">Ayah</label>
                        <select id="indukAyah" class="w-full p-2 rounded-xl text-sm"></select>
                    </div>
                </div>
                <div class="col-span-2">
                    <label class="text-[10px] font-black text-green-600 uppercase">Foto Ternak</label>
                    <input type="file" id="fotoInput" accept="image/*" class="w-full text-xs mt-1">
                </div>
            </div>
            <button id="btnSimpan" class="w-full mt-8 bg-green-700 text-white py-4 rounded-2xl font-black shadow-xl hover:bg-green-800 transition-all">SIMPAN DATA</button>
        </div>
    </div>

    <!-- MODAL DETAIL -->
    <div id="detailModal" class="fixed inset-0 z-[70] hidden items-center justify-center p-4 bg-black/90 backdrop-blur-md">
        <div class="glass w-full max-w-md rounded-[3rem] overflow-hidden relative shadow-2xl">
            <button onclick="closeDetail()" class="absolute top-5 right-5 z-10 bg-white/80 w-10 h-10 rounded-full text-gray-800 font-bold text-xl">✕</button>
            <div id="detailContent"></div>
        </div>
    </div>

    <script>
        // --- KONFIGURASI FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyC5iURiLrXJ-6AjgKfBlOW71Oo719AVNx4",
            authDomain: "putra-barokah-farm.firebaseapp.com",
            projectId: "putra-barokah-farm",
            storageBucket: "putra-barokah-farm.appspot.com",
            messagingSenderId: "877461927373",
            appId: "1:877461927373:web:5e9fbcb1b892d7cd6e8084"
        };

        const ADMIN_IDS = [
            "uvKshTqDchhJFNDkzGEC2MMgI003", 
            "lfghFBI24GVP0AqyfGHNCh5E4EL2"
        ];

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let allData = [];
        let currentAdmin = false;

        function toggleForm() { document.getElementById('formModal').classList.toggle('hidden'); document.getElementById('formModal').classList.toggle('flex'); }
        function checkCempe() { document.getElementById('cempeExtra').classList.toggle('hidden', document.getElementById('kategori').value !== 'Cempe'); }
        function closeDetail() { document.getElementById('detailModal').classList.add('hidden'); }
        function hideList() { document.getElementById('containerList').classList.add('hidden'); }

        // AMBIL DATA REALTIME
        db.collection("ternak_barokah").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            allData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            updateStats(allData);
            populateDropdowns(allData);
            
            // Refresh list jika sedang terbuka
            const currentCat = document.getElementById('categoryTitle').innerText.replace('DAFTAR ', '');
            if (!document.getElementById('containerList').classList.contains('hidden')) {
                filterCategory(currentCat);
            }
        });

        function filterCategory(cat) {
            const filtered = allData.filter(d => d.kategori === cat);
            document.getElementById('categoryTitle').innerText = "DAFTAR " + cat;
            renderList(filtered);
            document.getElementById('containerList').classList.remove('hidden');
        }

        function renderList(data) {
            const container = document.getElementById('listDomba');
            container.innerHTML = '';
            data.forEach(item => {
                const deleteBtn = currentAdmin ? `<button onclick="event.stopPropagation(); hapusTernak('${item.id}', '${item.nama}')" class="bg-red-100 p-2 rounded-lg text-red-600 hover:bg-red-600 hover:text-white transition-colors">🗑️</button>` : '';
                
                container.innerHTML += `
                    <div onclick="showDetail('${item.id}')" class="glass p-4 rounded-[2rem] shadow-xl flex gap-5 border border-white hover:scale-[1.02] transition-transform cursor-pointer relative">
                        <img src="${item.foto || 'https://via.placeholder.com/150'}" class="w-24 h-24 object-cover rounded-2xl shadow-inner bg-gray-100">
                        <div class="flex-1 py-1">
                            <div class="flex justify-between items-start">
                                <span class="text-[9px] font-black px-3 py-1 rounded-full ${item.kategori === 'Cempe' ? 'bg-yellow-100 text-yellow-700' : (item.kategori === 'Pejantan' ? 'bg-blue-100 text-blue-700' : 'bg-pink-100 text-pink-700')} uppercase">${item.kategori}</span>
                                ${deleteBtn}
                            </div>
                            <h4 class="text-xl font-black text-gray-800 mt-1 uppercase">${item.nama}</h4>
                            <p class="text-xs text-gray-400 font-bold italic">⚖️ ${item.berat} kg | 🎂 ${item.tglLahir}</p>
                            ${item.kategori === 'Cempe' ? `<p class="text-[9px] mt-2 text-blue-500 font-bold uppercase tracking-tighter">Silsilah ➔</p>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        async function hapusTernak(id, nama) {
            if (confirm(`⚠️ HAPUS DATA: Apakah Anda yakin ingin menghapus "${nama}" dari sistem Putra Barokah?`)) {
                try {
                    await db.collection('ternak_barokah').doc(id).delete();
                    alert("Data berhasil dihapus.");
                } catch (e) {
                    alert("Error hapus: " + e.message);
                }
            }
        }

        function showDetail(id) {
            const item = allData.find(d => d.id === id);
            if (!item) return;
            const ibu = allData.find(d => d.nama === item.ibu) || { foto: 'https://via.placeholder.com/150?text=No+Photo' };
            const ayah = allData.find(d => d.nama === item.ayah) || { foto: 'https://via.placeholder.com/150?text=No+Photo' };

            const content = `
                <img src="${item.foto || 'https://via.placeholder.com/400'}" class="w-full h-64 object-cover">
                <div class="p-8">
                    <div class="flex justify-between items-start mb-6">
                        <div><h2 class="text-3xl font-black text-gray-800 uppercase">${item.nama}</h2><p class="text-sm font-bold text-gray-400 uppercase tracking-widest">${item.kategori}</p></div>
                        <div class="text-right"><p class="text-2xl font-black text-green-600">${item.berat} kg</p><p class="text-[10px] font-bold text-gray-400 tracking-widest uppercase">${item.tglLahir}</p></div>
                    </div>
                    ${item.kategori === 'Cempe' ? `
                        <div class="mt-8 border-t pt-6">
                            <h3 class="text-xs font-black text-gray-800 uppercase mb-4 tracking-widest border-l-4 border-yellow-500 pl-3 italic">Garis Keturunan</h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="text-center"><img src="${ibu.foto}" class="w-full h-32 object-cover rounded-2xl shadow-md border-2 border-pink-100"><p class="text-[10px] font-black mt-2 text-pink-600 uppercase">Ibu: ${item.ibu}</p></div>
                                <div class="text-center"><img src="${ayah.foto}" class="w-full h-32 object-cover rounded-2xl shadow-md border-2 border-blue-100"><p class="text-[10px] font-black mt-2 text-blue-600 uppercase">Ayah: ${item.ayah}</p></div>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
            document.getElementById('detailContent').innerHTML = content;
            document.getElementById('detailModal').classList.remove('hidden');
            document.getElementById('detailModal').classList.add('flex');
        }

        function updateStats(data) {
            document.getElementById('totalIndukan').innerText = data.filter(d => d.kategori === 'Indukan').length;
            document.getElementById('totalPejantan').innerText = data.filter(d => d.kategori === 'Pejantan').length;
            document.getElementById('totalCempe').innerText = data.filter(d => d.kategori === 'Cempe').length;
        }

        function populateDropdowns(data) {
            const ibu = document.getElementById('indukIbu');
            const ayah = document.getElementById('indukAyah');
            ibu.innerHTML = '<option value="-">-</option>'; ayah.innerHTML = '<option value="-">-</option>';
            data.forEach(d => {
                if(d.kategori === 'Indukan') ibu.innerHTML += `<option value="${d.nama}">${d.nama}</option>`;
                if(d.kategori === 'Pejantan') ayah.innerHTML += `<option value="${d.nama}">${d.nama}</option>`;
            });
        }

        document.getElementById('btnSimpan').onclick = async () => {
            const file = document.getElementById('fotoInput').files[0];
            const saveBtn = document.getElementById('btnSimpan');
            if(!document.getElementById('nama').value) return alert("Nama wajib diisi!");
            
            saveBtn.disabled = true; saveBtn.innerText = "MENYIMPAN...";
            
            let base64 = "";
            if(file) {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    base64 = reader.result;
                    processSave(base64);
                };
            } else {
                processSave("");
            }
        };

        async function processSave(foto) {
            await db.collection('ternak_barokah').add({
                nama: document.getElementById('nama').value,
                kategori: document.getElementById('kategori').value,
                tglLahir: document.getElementById('tglLahir').value,
                berat: document.getElementById('berat').value,
                foto: foto,
                ibu: document.getElementById('indukIbu').value,
                ayah: document.getElementById('indukAyah').value,
                createdAt: new Date()
            });
            document.getElementById('btnSimpan').disabled = false;
            document.getElementById('btnSimpan').innerText = "SIMPAN DATA";
            document.getElementById('nama').value = '';
            document.getElementById('berat').value = '';
            toggleForm();
        }

        auth.onAuthStateChanged(user => {
            currentAdmin = user && ADMIN_IDS.includes(user.uid);
            document.getElementById('adminMenu').classList.toggle('hidden', !currentAdmin);
            document.getElementById('btnLogout').classList.toggle('hidden', !currentAdmin);
            document.getElementById('btnLogin').classList.toggle('hidden', currentAdmin);
            document.getElementById('authStatus').innerText = currentAdmin ? "OPERATOR: " + user.email : "MODE: MONITORING PETERNALAN";
            
            // Refresh list agar tombol hapus muncul/hilang sesuai login
            if (!document.getElementById('containerList').classList.contains('hidden')) {
                const currentCat = document.getElementById('categoryTitle').innerText.replace('DAFTAR ', '');
                filterCategory(currentCat);
            }
        });

        document.getElementById('btnLogin').onclick = () => {
            const email = prompt("Email Admin:"); const pass = prompt("Password:");
            if(email && pass) auth.signInWithEmailAndPassword(email, pass).catch(e => alert("Akses Ditolak!"));
        };
    </script>
</body>
</html>
